<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow"><title>Проверяем оплату | ПравКомпас</title><link rel="icon" href="/assets/favicon/favicon.ico?v=3" sizes="any"><link rel="stylesheet" href="/assets/css/payment.css?v=1"><script src="/assets/js/analytics.js?v=20261030-r2" defer></script><script src="/assets/js/payment-confirmation.js?v=20261029" ></script></head><body>
<header class="pay-header"><a class="pay-brand" href="/"><span class="pay-brand-mark">ПК</span><span><strong>ПравКомпас</strong><small>юридическая практика Сергея Демченко</small></span></a></header>
<main class="status-page"><section class="status-card" id="statusCard"><div class="status-icon" aria-hidden="true">✓</div><p class="pay-eyebrow">Возврат после оплаты</p><h1>Проверяем платёж</h1><p id="statusText">Обычно подтверждение Robokassa занимает несколько секунд. Не закрывайте страницу.</p><div class="status-actions"><a class="status-primary" href="mailto:info@zakondemchenko.ru">Написать юристу</a><a href="/">На главную</a></div></section></main>
<script>(()=>{const q=new URLSearchParams(location.search);const order=q.get('Shp_order')||q.get('shp_order')||sessionStorage.getItem('legal_order')||(history.state&&history.state.legalOrder);if(order)history.replaceState({legalOrder:order},'',location.pathname);const text=document.getElementById('statusText');const card=document.getElementById('statusCard');let attempts=0;const poll=async()=>{if(!order){text.textContent='Robokassa вернула вас на сайт. Подтверждение и дальнейшие инструкции придут на email, указанный при оплате.';return}try{const r=await fetch('/api/legal_order_status.php?order='+encodeURIComponent(order),{cache:'no-store'});const d=await r.json();if(d.success&&(d.status==='paid'||d.status==='test_paid')){card.classList.add('is-paid');card.querySelector('h1').textContent=d.status==='test_paid'?'Тестовая оплата прошла':'Оплата получена';text.textContent=d.status==='test_paid'?'Контрольный заказ №'+d.order_number+' успешно прошёл весь платёжный маршрут. Реального списания не было.':'Заказ №'+d.order_number+' принят. Инструкции отправлены на email. Письменный ответ — в течение 24 часов после получения достаточных фактов и документов.';window.dispatchEvent(new CustomEvent('pravkompas:payment-confirmed',{detail:{id:Number(d.order_number),status:d.status,amount:d.amount}}));sessionStorage.removeItem('legal_order');return}}catch(e){}attempts++;if(attempts<12)setTimeout(poll,2500);else text.textContent='Платёж обрабатывается. Подтверждение и дальнейшие инструкции придут на email. Если письма нет 15 минут, напишите Сергею.'};poll()})();</script></body></html>
